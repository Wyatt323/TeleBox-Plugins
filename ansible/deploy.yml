---
- name: Deploy personal TeleBox plugins
  hosts: Skyline-SG
  become: false
  gather_facts: false
  vars:
    telebox_dir: /root/telebox
    plugin_source_dir: "{{ playbook_dir }}/../plugins"
    plugin_target_dir: "{{ telebox_dir }}/plugins"

  tasks:
    - name: Require TeleBox project directory
      ansible.builtin.stat:
        path: "{{ telebox_dir }}/package.json"
      register: telebox_package

    - name: Abort if TeleBox is unavailable
      ansible.builtin.assert:
        that: telebox_package.stat.exists
        fail_msg: "TeleBox project not found at {{ telebox_dir }}"

    - name: Create custom plugin directory
      ansible.builtin.file:
        path: "{{ plugin_target_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy personal plugin files
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ plugin_target_dir }}/{{ item | basename }}"
        owner: root
        group: root
        mode: "0644"
        backup: true
      with_fileglob:
        - "{{ plugin_source_dir }}/*.ts"
      notify: Restart TeleBox

    - name: Validate deployed personal plugins with esbuild
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          for file in plugins/tj.ts; do
            test -f "$file"
            node -e 'const fs=require("fs"); const esbuild=require("esbuild"); esbuild.transformSync(fs.readFileSync(process.argv[1], "utf8"), {loader:"ts", target:"es2020"}); console.log(process.argv[1] + ": OK")' "$file"
          done
        chdir: "{{ telebox_dir }}"
      changed_when: false

  handlers:
    - name: Restart TeleBox
      ansible.builtin.command:
        cmd: pm2 restart telebox --update-env
        chdir: "{{ telebox_dir }}"
      changed_when: true
